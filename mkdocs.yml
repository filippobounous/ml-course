# mkdocs config for the course site.
#
# Single source of truth: the markdown lives under modules/, portfolio/,
# and the repo root. `scripts/build_docs.py` symlinks those files into
# the gitignored `docs/` tree before each build so mkdocs has a clean
# tree to render. Build with:
#
#   python scripts/build_docs.py            # static build into ./site/
#   python scripts/build_docs.py --serve    # live-reload dev server
#
# Or, on GitHub Actions, the `docs.yml` workflow runs the staging step
# and then `mkdocs build --strict`.

site_name: ML/AI Course for Quantitative Minds
site_description: A 12-week intensive course taking quantitatively-literate learners from tutorial ML to research-grade fluency.
site_url: https://filippobounous.github.io/ml-course/
repo_url: https://github.com/filippobounous/ml-course
repo_name: filippobounous/ml-course
edit_uri: edit/main/

docs_dir: docs
site_dir: site

# These files are cross-referenced by pages in the nav but don't need their
# own nav entry (they're developer-facing meta).
not_in_nav: |
  TODO.md
  PR_PLAN.md
  CONTRIBUTING.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

